<!-- Modal container with conditional display -->
<div *ngIf="showRegisterModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-6 rounded-lg shadow-lg max-w-lg w-full">
    <h2 class="text-2xl font-bold mb-4 text-center">Inscription</h2>
    <form (ngSubmit)="register()">
      <!-- Nom -->
      <div class="mb-4">
        <label class="block text-gray-700">Nom</label>
        <input [(ngModel)]="user.nom" name="nom" required class="w-full px-3 py-2 border rounded" />
      </div>

      <!-- Prénom -->
      <div class="mb-4">
        <label class="block text-gray-700">Prénom</label>
        <input [(ngModel)]="user.prenom" name="prenom" required class="w-full px-3 py-2 border rounded" />
      </div>

      <!-- Téléphone -->
      <div class="mb-4">
        <label class="block text-gray-700">Téléphone</label>
        <input [(ngModel)]="user.telephone" name="telephone" required class="w-full px-3 py-2 border rounded" />
      </div>

      <!-- Rôle avec liaison ngModel -->
      <div class="mb-4">
        <label class="block text-gray-700">Rôle</label>
        <select [(ngModel)]="user.roleId" name="roleId" required class="w-full px-3 py-2 border rounded">
          <option disabled selected>Choisissez votre rôle</option>
          <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
        </select>
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-gray-700">Email</label>
        <input type="email" [(ngModel)]="user.email" name="email" required class="w-full px-3 py-2 border rounded" />
      </div>

      <!-- Submit button -->
      <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
        S'inscrire
      </button>
    </form>

    <!-- Close modal button -->
    <button (click)="closeRegisterModal()" class="mt-4 w-full bg-red-500 text-white py-2 rounded">
      Fermer
    </button>
  </div>
</div>
